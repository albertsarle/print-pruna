<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 200px;
        font-family: system-ui, sans-serif;
        background: #fff;
      }
      .brx-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 8px;
        border-bottom: 1px solid #eee;
      }
      .brx-header img {
        width: 20px;
        height: 20px;
      }
      .brx-header strong {
        font-size: 13px;
        color: #3c1b45;
      }
      .brx-menu {
        display: flex;
        flex-direction: column;
        padding: 6px;
      }
      button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        border: none;
        background: none;
        text-align: left;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        color: #1a1a1a;
      }
      button:hover {
        background: #f2f2f2;
      }
      button .brx-desc {
        font-size: 11px;
        color: #777;
        font-weight: normal;
      }
      button strong {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="brx-header">
      <img src="../icons/icon48.png" alt="" />
      <strong data-i18n="extName">PrintPruna</strong>
    </div>
    <div class="brx-menu">
      <button id="brx-select" type="button">
        <strong data-i18n="popupSelectTitle">Selecciona</strong>
        <span class="brx-desc" data-i18n="popupSelectDesc">Marca un bloc i amaga la resta</span>
      </button>
      <button id="brx-remove" type="button">
        <strong data-i18n="popupRemoveTitle">Elimina</strong>
        <span class="brx-desc" data-i18n="popupRemoveDesc">Marca un bloc i elimina'l</span>
      </button>
      <button id="brx-resize" type="button">
        <strong data-i18n="popupResizeTitle">Redimensiona</strong>
        <span class="brx-desc" data-i18n="popupResizeDesc">Arrossega la vora d'un bloc per canviar-ne la mida</span>
      </button>
      <button id="brx-remove-ads" type="button">
        <strong data-i18n="popupRemoveAdsTitle">Elimina Publicitat</strong>
        <span class="brx-desc" data-i18n="popupRemoveAdsDesc">Detecta i amaga banners automàticament</span>
      </button>
      <button id="brx-print" type="button">
        <strong data-i18n="popupPrintTitle">Imprimeix</strong>
        <span class="brx-desc" data-i18n="popupPrintDesc">Obre el diàleg d'impressió</span>
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
