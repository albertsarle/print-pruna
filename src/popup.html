<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 200px;
        font-family: system-ui, sans-serif;
        background: #fff;
      }
      .brx-menu {
        display: flex;
        flex-direction: column;
        padding: 6px;
      }
      button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        border: none;
        background: none;
        text-align: left;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        color: #1a1a1a;
      }
      button:hover {
        background: #f2f2f2;
      }
      button .brx-desc {
        font-size: 11px;
        color: #777;
        font-weight: normal;
      }
      button strong {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="brx-menu">
      <button id="brx-select" type="button">
        <strong>Selecciona</strong>
        <span class="brx-desc">Marca un bloc i amaga la resta</span>
      </button>
      <button id="brx-remove" type="button">
        <strong>Elimina</strong>
        <span class="brx-desc">Marca un bloc i elimina'l</span>
      </button>
      <button id="brx-print" type="button">
        <strong>Imprimeix</strong>
        <span class="brx-desc">Obre el diàleg d'impressió</span>
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
