name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate manifest and locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-extension.js

  build:
    name: Build extension zip
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          zip -r "printpruna-${{ steps.version.outputs.version }}.zip" \
            manifest.json icons _locales src -x "*.DS_Store"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: printpruna-${{ steps.version.outputs.version }}
          path: printpruna-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: printpruna-${{ steps.version.outputs.version }}.zip
